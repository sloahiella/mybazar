name: Mohasagor daily sync

on:
  schedule:
    - cron: '0 19 * * *'   # বাংলাদেশ সময় রাত ১টা
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Sync Mohasagor catalog
        env:
          SYNC_KEY: ${{ secrets.SYNC_KEY }}
          SITE: https://www.sohelmart.com
        run: |
          set -u
          RUN=$(date +%s)

          # একটা পেজ আনে। ব্যর্থ হলে অপেক্ষা করে আবার চেষ্টা করে। সফল হলে মোট পেজ সংখ্যা ছাপে
          fetch_page() {
            local PG=$1
            local TRY=0
            while [ $TRY -lt 8 ]; do
              TRY=$((TRY+1))
              RES=$(curl -sL --max-time 90 "$SITE/api/mohasagor-sync?key=$SYNC_KEY&pages=$PG&run=$RUN" || true)
              OK=$(echo "$RES" | jq -r '.ok // false' 2>/dev/null || echo false)
              FP=$(echo "$RES" | jq -r '(.failedPages // []) | length' 2>/dev/null || echo 1)
              if [ "$OK" = "true" ] && [ "$FP" = "0" ]; then
                LAST=$(echo "$RES" | jq -r '.lastPage')
                echo "page $PG ok (last=$LAST)" >&2
                echo "$LAST"
                return 0
              fi
              echo "page $PG failed (try $TRY): $(echo "$RES" | head -c 150)" >&2
              sleep $((10 + TRY * 10))
            done
            return 1
          }

          LAST=$(fetch_page 1) || { echo "page 1 could not be fetched"; exit 1; }
          case "$LAST" in ''|*[!0-9]*) echo "bad last page value: $LAST"; exit 1;; esac
          echo "total pages: $LAST"

          BAD=""
          PG=2
          while [ $PG -le $LAST ]; do
            if ! fetch_page $PG > /dev/null; then BAD="$BAD $PG"; fi
            if [ $(echo $BAD | wc -w) -gt 8 ]; then echo "too many failures:$BAD"; exit 1; fi
            PG=$((PG+1))
            sleep 3
          done

          if [ -n "$BAD" ]; then echo "failed pages remain:$BAD"; exit 1; fi
          curl -sL --max-time 120 "$SITE/api/mohasagor-sync?key=$SYNC_KEY&finalize=1&run=$RUN"
          echo